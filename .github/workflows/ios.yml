name: iOS simulator

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  NOTIFICATION_PLUGIN_REF: v6.0
  STOREKIT_PLUGIN_REF: beabb0464072175b59281cab825c9d23761fc237

jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot and iOS export template
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TEMPLATES="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES"
          unzip -q -j templates.tpz "templates/ios.zip" "templates/version.txt" -d "$TEMPLATES"
          rm godot.zip templates.tpz

      - name: Cache iOS plugins
        id: plugins
        uses: actions/cache@v4
        with:
          path: ios/plugins
          key: ios-plugins-${{ env.GODOT_VERSION }}-${{ env.NOTIFICATION_PLUGIN_REF }}-${{ env.STOREKIT_PLUGIN_REF }}-${{ hashFiles('.github/scripts/build-ios-plugins.sh') }}

      - uses: actions/setup-java@v4
        if: steps.plugins.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Build iOS plugins
        if: steps.plugins.outputs.cache-hit != 'true'
        run: |
          gem install xcodeproj --no-document
          bash .github/scripts/build-ios-plugins.sh

      - name: Export Xcode project
        run: |
          Godot --path . --headless --import
          mkdir -p build/ios
          Godot --path . --headless --export-debug "iOS" build/ios/focus-tycoon.ipa 2>&1 | tee export.log
          test -d build/ios/focus-tycoon.xcodeproj

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project build/ios/focus-tycoon.xcodeproj -scheme focus-tycoon \
            -configuration Debug -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios/derived CODE_SIGNING_ALLOWED=NO \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO build | tail -n 40

      - name: Run in simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE"
          APP=$(find build/ios/derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Installing $APP ($BUNDLE_ID)"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch --stdout="$PWD/app.log" --stderr="$PWD/app.log" "$DEVICE" "$BUNDLE_ID"
          sleep 30
          xcrun simctl io "$DEVICE" screenshot ios-simulator.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep "$BUNDLE_ID"
          grep "Platform backends" app.log
          grep -q "Platform backends: AppleStore, PluginNotificationBackend" app.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            ios-simulator.png
            export.log
            app.log
