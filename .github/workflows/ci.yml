name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          rm godot.zip

      - name: Import project
        run: godot --path . --headless --import

      - name: Run tests
        run: |
          set -o pipefail
          godot --path . --headless -s res://tests/run_tests.gd 2>&1 | tee tests.log
          if grep -q "SCRIPT ERROR" tests.log; then
            echo "Tests reported script errors"
            exit 1
          fi

      - name: Smoke boot
        run: |
          godot --path . --headless --quit-after 120 2>&1 | tee smoke.log
          if grep -q "SCRIPT ERROR" smoke.log; then
            echo "Smoke boot reported script errors"
            exit 1
          fi

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
